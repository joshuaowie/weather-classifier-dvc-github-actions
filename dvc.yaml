stages:
  preprocess:
    cmd: python preprocess_dataset.py
    deps:
    - preprocess_dataset.py
    - raw_dataset/weather.csv
    - utils_and_constants.py
    outs:
    - processed_dataset/weather.csv
  train:
    cmd: python train.py
    deps:
    - metrics_and_plots.py
    - model.py
    - processed_dataset/weather.csv
    - train.py
    - utils_and_constants.py
    metrics:
      # Specify the metrics file as target
      - metrics.json:
          cache: false
    plots:
      # Set the target to the file containing predictions data
      - predictions.csv:
          # Write the plot template. A normalized confusion matrix would display the relative proportion of true positives, false positives, etc., instead of the raw numbers.
          template: confusion_normalized
          x: predicted_label
          y: true_label
          x_label: 'Predicted label'
          y_label: 'True label'
          title: Confusion matrix
          # Set the cache parameter to store
          # plot data in git repository
          cache: false
      - roc_curve.csv:
          template: linear
          x: fpr
          y: tpr
          title: ROC Curve
          x_label: False Positive Rate
          y_label: True Positive Rate
          cache: false
